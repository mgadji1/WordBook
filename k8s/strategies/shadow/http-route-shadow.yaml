apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
spec:
  parentRefs:
    - name: wordbook-gateway
  rules:
    - backendRefs:
        - name: backend-blue-service
          port: 8080
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: backend-green-service
              port: 8080
