apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
spec:
  parentRefs:
    - name: wordbook-gateway
  rules:
    - matches:
      - headers:
          - type: Exact
            name: x-user-group
            value: beta
      backendRefs:
        - name: backend-green-service
          port: 8080
    - backendRefs:
        - name: backend-blue-service
          port: 8080
