apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vlagent
    spec:
      serviceAccountName: vlagent
      containers:
        - name: vlagent
          image: victoriametrics/vlagent:v1.53.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9429
              protocol: TCP
          args:
            - --kubernetesCollector
            - --loggerFormat=json
            - --remoteWrite.url=http://victoria-logs-service:9428/insert/native
            - --tmpDataPath=/var/lib/vlagent
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlib
              mountPath: /var/lib
              readOnly: true
            - name: vlagent-data
              mountPath: /var/lib/vlagent
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlib
          hostPath:
            path: /var/lib
        - name: vlagent-data
          hostPath:
            path: /var/lib/vlagent
            type: DirectoryOrCreate