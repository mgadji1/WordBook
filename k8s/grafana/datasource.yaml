apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
data:
  victoria-logs.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://victoria-logs-service:9428
        isDefault: false

  victoria-metrics.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        url: http://vmsingle-victoria-metrics-single-server:8428
        isDefault: true