apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prober
  template:
    metadata:
      labels:
        app: prober
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9101"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: wordbook-prober:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: "http://backend-service:8080/"
          ports:
            - name: metrics
              containerPort: 9101